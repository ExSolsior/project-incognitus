[workspace]
members = [
    "program",
    "lib",
]
resolver = "2"

[workspace.dependencies]
bytemuck = "1.25.0"
pinocchio = { version = "0.11.1", features = ["cpi", "account-resize"] }
pinocchio-system = "0.6.1"
mollusk-svm = "0.12.0"
solana-pubkey = "4.1.0"
solana-account = "3.4.0"
solana-instruction = "3.3.0"
solana-program-error = "3.0.1"
solana-sdk-ids = "3.1.0"
